name: covenant-tcg-portal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: covenant
      POSTGRES_PASSWORD: covenant
      POSTGRES_DB: covenant_tcg_portal
    ports:
      - "5432:5432"
    volumes:
      - covenant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covenant -d covenant_tcg_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  covenant_postgres_data:
